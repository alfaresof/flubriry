name: flubriry
description: "A small, carefully made Flutter component library — bilingual, light/dark, copy-ready."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^2.6.1
  figma_squircle: ^0.6.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/brand/
    - assets/images/

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/instrument-serif/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/instrument-serif/InstrumentSerif-Italic.ttf
          style: italic
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Medium.ttf
          weight: 500
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans-arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
